# CI Workflow for ralph
# Builds and tests using the devcontainer for consistency with development

name: CI

# PRs into master come from develop or hotfix/** branches, whose push runs
# already report the required check on the PR's head commit.
on:
  push:
    branches: [master, develop, 'hotfix/**']
  pull_request:
    branches: [develop]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/build.yml
    with:
      build_command: './scripts/build.sh && ./scripts/run_tests.sh -v'
      upload_artifact: true
